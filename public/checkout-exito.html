<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Compra realizada!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF9F5; --ink:#3F5347; --ink-muted:#8B9A8D; --accent:#5C7A65;
    --stamp-green:#5C7A65; --stamp-green-soft:rgba(92,122,101,0.14); --line:rgba(63,82,71,0.16); --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Archivo', -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:28px;
  }
  .icono{
    width:64px; height:64px; border-radius:50%; background:var(--stamp-green-soft); border:1px solid var(--stamp-green);
    display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--stamp-green); margin-bottom:18px;
  }
  h1{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:26px; margin:0 0 8px; }
  p{ color:var(--ink-muted); font-size:15px; max-width:320px; margin:0 0 22px; line-height:1.5; }
  .pedido-id{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px; margin-bottom:24px; }
  a.volver{
    background:var(--accent); color:#fff; text-decoration:none; padding:14px 28px; border-radius:var(--radius);
    font-weight:700; font-size:15px;
  }
</style>
</head>
<body>
  <div class="icono">✓</div>
  <h1>¡Gracias por tu compra!</h1>
  <p>Tu pago fue aprobado. En breve nos ponemos en contacto para coordinar la entrega o el envío.</p>
  <div class="pedido-id" id="pedidoId"></div>
  <a class="volver" href="/">Volver al catálogo</a>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pedido = params.get('pedido');
    if (pedido) {
      document.getElementById('pedidoId').textContent = 'Número de pedido: ' + pedido;
      // Respaldo por si el webhook de Payway todavía no llegó: consulta el
      // estado real del pago y actualiza el pedido si hace falta.
      fetch('/verificar-pago-payway/' + encodeURIComponent(pedido)).catch(() => {});
    } else {
      document.getElementById('pedidoId').style.display = 'none';
    }
  </script>
</body>
</html>
